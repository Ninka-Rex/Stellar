name: Release

on:
  workflow_dispatch:
    inputs:
      version_override:
        description: 'Version to release (blank = read from CMakeLists.txt)'
        required: false
        default: ''
      platform:
        description: 'Which platforms to build'
        type: choice
        required: false
        default: both
        options:
          - both
          - windows
          - linux
      dry_run:
        description: 'Dry run — build and package but skip GitHub release creation and update.json commit'
        type: boolean
        required: false
        default: false

# Default to read-only; the release job upgrades to write for its own scope.
permissions:
  contents: read

# Some pinned action releases still ship a Node 20 entrypoint. Force the Node 24
# runtime now so they don't emit deprecation warnings / break after the cutoff.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    if: ${{ inputs.platform == 'both' || inputs.platform == 'windows' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
            echo "version=${{ github.event.inputs.version_override }}" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep -oP 'project\s*\(\s*\w+\s+VERSION\s+\K[\d.]+' CMakeLists.txt | head -1)
            echo "version=$ver" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Qt 6.8 (MSVC 2022)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          # OpenSSL 3 runtime DLLs (libssl-3-x64 / libcrypto-3-x64) that Qt's TLS
          # backend loads at runtime. windeployqt does NOT copy these, so without
          # bundling them the app fails with "libssl-3-x64.dll was not found".
          tools: 'tools_openssl_x64'
          cache: true
          cache-key-prefix: qt-win-msvc2022-6.8

      - name: Set QTDIR from Qt6_DIR
        shell: bash
        run: |
          # install-qt-action v4 exposes the arch root as QT_ROOT_DIR (v3 used Qt6_DIR).
          QTDIR=$(cd "$QT_ROOT_DIR" && pwd -W)
          echo "QTDIR=$QTDIR" >> "$GITHUB_ENV"

      - name: Set up MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download third-party sources (Windows)
        shell: bash
        run: |
          mkdir -p third_party
          # libtorrent-rasterbar 2.0.12
          if [ ! -f third_party/libtorrent-rasterbar-2.0.12/CMakeLists.txt ]; then
            curl -fsSL \
              "https://github.com/arvidn/libtorrent/releases/download/v2.0.12/libtorrent-rasterbar-2.0.12.tar.gz" \
              -o libtorrent.tar.gz
            tar -xzf libtorrent.tar.gz -C third_party/
            rm libtorrent.tar.gz
          fi
          # libmaxminddb (Windows uses vendored build)
          if [ ! -f third_party/libmaxminddb/CMakeLists.txt ]; then
            curl -fsSL \
              "https://github.com/maxmind/libmaxminddb/archive/refs/heads/main.tar.gz" \
              -o libmaxminddb.tar.gz
            mkdir -p third_party/libmaxminddb
            tar -xzf libmaxminddb.tar.gz -C third_party/libmaxminddb --strip-components=1
            rm libmaxminddb.tar.gz
          fi

      - name: Install Boost (headers only)
        shell: bash
        run: |
          # libtorrent 2.0.12 needs only Boost::headers + header-only Boost.System,
          # so the headers package alone is sufficient — no compiled libs required.
          # The windows-latest image no longer ships a pre-installed Boost at
          # C:/local/boost_*, so fetch a pinned headers archive deterministically.
          BOOST_VER=1.88.0
          BOOST_UND=${BOOST_VER//./_}
          BOOST_DIR="C:/local/boost_${BOOST_UND}"
          URL="https://archives.boost.io/release/${BOOST_VER}/source/boost_${BOOST_UND}.7z"
          echo "Downloading Boost ${BOOST_VER} headers..."
          curl -fsSL "$URL" -o boost.7z
          mkdir -p C:/local
          7z x boost.7z -oC:/local >/dev/null
          [ -d "$BOOST_DIR/boost" ] || { echo "ERROR: Boost extraction failed"; exit 1; }
          rm boost.7z
          echo "BOOST_ROOT=$BOOST_DIR"       >> "$GITHUB_ENV"
          echo "BOOST_INCLUDEDIR=$BOOST_DIR" >> "$GITHUB_ENV"
          echo "Using Boost: $BOOST_DIR"

      - name: Configure (windows-release)
        shell: bash
        run: cmake --preset windows-release

      - name: Build (windows-release)
        shell: bash
        run: cmake --build --preset windows-release --config Release

      - name: Download yt-dlp
        shell: bash
        run: |
          curl -fsSL \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" \
            -o "build/windows-release/yt-dlp.exe"

      - name: Download ffmpeg + ffprobe (BtbN GPL)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_URL=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for a in data['assets']:
              if a['name'] == 'ffmpeg-master-latest-win64-gpl.zip':
                  print(a['browser_download_url']); break
          ")
          curl -fsSL "$ASSET_URL" -o ffmpeg-win.zip
          python3 -c "
          import zipfile, shutil, os
          with zipfile.ZipFile('ffmpeg-win.zip') as z:
              for name in z.namelist():
                  base = os.path.basename(name)
                  if base in ('ffmpeg.exe', 'ffprobe.exe'):
                      with z.open(name) as src, open(f'build/windows-release/{base}', 'wb') as dst:
                          shutil.copyfileobj(src, dst)
          "
          rm ffmpeg-win.zip

      - name: Download and decompress db-ip GeoIP database
        shell: bash
        run: |
          YM=$(date -u +%Y-%m)
          DB_URL="https://download.db-ip.com/free/dbip-city-lite-${YM}.mmdb.gz"
          mkdir -p build/windows-release/data
          curl -fsSL "$DB_URL" -o "build/windows-release/data/dbip-city-lite-${YM}.mmdb.gz"
          python3 -c "
          import gzip, shutil
          src = 'build/windows-release/data/dbip-city-lite-${YM}.mmdb.gz'
          with gzip.open(src, 'rb') as f_in, open(src[:-3], 'wb') as f_out:
              shutil.copyfileobj(f_in, f_out)
          "
          rm "build/windows-release/data/dbip-city-lite-${YM}.mmdb.gz"

      - name: Run windeployqt
        shell: bash
        run: |
          windeployqt \
            --release \
            --qmldir app/qml \
            --no-translations \
            "build/windows-release/Stellar.exe"

      - name: Copy QtQuick.Dialogs (windeployqt gap)
        shell: bash
        run: |
          SRC="$QTDIR/qml/QtQuick/Dialogs"
          DST="build/windows-release/qml/QtQuick/Dialogs"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            cp -r "$SRC/." "$DST/"
          fi

      - name: Copy OpenSSL runtime DLLs
        shell: bash
        run: |
          # Qt loads OpenSSL dynamically; windeployqt doesn't bundle it. installer.iss
          # globs build/windows-release/*.dll, so dropping them there is enough.
          # install-qt-action's tools_openssl_x64 lands under $IQTA_TOOLS.
          DST="build/windows-release"
          FOUND=0
          for dir in \
            "$IQTA_TOOLS/Tools/OpenSSLv3/Win_x64/bin" \
            "$IQTA_TOOLS/OpenSSLv3/Win_x64/bin" \
            "$QT_ROOT_DIR/../../Tools/OpenSSLv3/Win_x64/bin"; do
            if [ -f "$dir/libssl-3-x64.dll" ]; then
              cp "$dir/libssl-3-x64.dll" "$dir/libcrypto-3-x64.dll" "$DST/"
              echo "Copied OpenSSL DLLs from: $dir"
              FOUND=1
              break
            fi
          done
          [ "$FOUND" = 1 ] || { echo "ERROR: OpenSSL DLLs not found (searched IQTA_TOOLS=$IQTA_TOOLS)"; exit 1; }

      - name: Build installer (Inno Setup 6)
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ISCC=""
          for candidate in \
            "iscc" \
            "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "C:/Program Files/Inno Setup 6/ISCC.exe"; do
            if command -v "$candidate" &>/dev/null || [ -f "$candidate" ]; then
              ISCC="$candidate"; break
            fi
          done
          [[ -n "$ISCC" ]] || { echo "ERROR: iscc not found"; exit 1; }

          mkdir -p packaging/windows/output
          # Git Bash (MSYS) rewrites args that look like Unix paths, so "/DAppVersion=..."
          # gets mangled into a second bare filename -> ISCC errors "more than one script
          # filename". Disable that conversion for this native Windows tool.
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' "$ISCC" \
            "/DAppVersion=$VERSION" \
            "/DOutputDirOverride=$(pwd -W)/packaging/windows/output" \
            "/DOutputBaseFilenameOverride=StellarSetup-$VERSION" \
            "packaging/windows/installer.iss"

      - name: Compute SHA256 of installer
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          INSTALLER="packaging/windows/output/StellarSetup-${VERSION}.exe"
          SHA=$(python3 -c "
          import hashlib, sys
          h = hashlib.sha256()
          with open(sys.argv[1], 'rb') as f:
              for chunk in iter(lambda: f.read(65536), b''): h.update(chunk)
          print(h.hexdigest())
          " "$INSTALLER")
          echo "sha256:${SHA}" > windows-sha256.txt
          echo "Windows installer SHA256: sha256:${SHA}"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-artifacts
          path: |
            packaging/windows/output/StellarSetup-*.exe
            windows-sha256.txt
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-22.04
    if: ${{ inputs.platform == 'both' || inputs.platform == 'linux' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
            echo "version=${{ github.event.inputs.version_override }}" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep -oP 'project\s*\(\s*\w+\s+VERSION\s+\K[\d.]+' CMakeLists.txt | head -1)
            echo "version=$ver" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libssl-dev \
            libboost-all-dev \
            libmaxminddb-dev \
            patchelf \
            dpkg-dev \
            rpm \
            libxcb-cursor0 \
            libxcb-cursor-dev \
            libx11-dev \
            libxkbcommon-x11-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-render-util0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb-randr0-dev \
            libxcb-shape0-dev \
            libxcb-shm0-dev \
            libxcb-sync-dev \
            libgl-dev \
            libglu1-mesa-dev

      - name: Install Qt 6.8 (Linux GCC)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true
          cache-key-prefix: qt-linux-gcc64-6.8

      - name: Set QTDIR from Qt6_DIR
        run: |
          # install-qt-action v4 exposes the arch root as QT_ROOT_DIR (v3 used Qt6_DIR).
          QTDIR=$(cd "$QT_ROOT_DIR" && pwd)
          echo "QTDIR=$QTDIR" >> "$GITHUB_ENV"

      - name: Download third-party sources (Linux)
        run: |
          mkdir -p third_party
          # libtorrent-rasterbar 2.0.12
          if [ ! -f third_party/libtorrent-rasterbar-2.0.12/CMakeLists.txt ]; then
            curl -fsSL \
              "https://github.com/arvidn/libtorrent/releases/download/v2.0.12/libtorrent-rasterbar-2.0.12.tar.gz" \
              -o libtorrent.tar.gz
            tar -xzf libtorrent.tar.gz -C third_party/
            rm libtorrent.tar.gz
          fi
          # libmaxminddb: build from source under third_party/ (same as Windows).
          # CMakeLists only wires GeoIP via the vendored source tree (maxminddb::maxminddb);
          # the apt libmaxminddb-dev package is never picked up, so without this the
          # Linux build silently ships with STELLAR_HAS_MAXMINDDB undefined (no world map).
          if [ ! -f third_party/libmaxminddb/CMakeLists.txt ]; then
            curl -fsSL \
              "https://github.com/maxmind/libmaxminddb/archive/refs/heads/main.tar.gz" \
              -o libmaxminddb.tar.gz
            mkdir -p third_party/libmaxminddb
            tar -xzf libmaxminddb.tar.gz -C third_party/libmaxminddb --strip-components=1
            rm libmaxminddb.tar.gz
          fi

      - name: Download and decompress db-ip GeoIP database
        run: |
          YM=$(date -u +%Y-%m)
          DB_URL="https://download.db-ip.com/free/dbip-city-lite-${YM}.mmdb.gz"
          mkdir -p app/data
          curl -fsSL "$DB_URL" -o "app/data/dbip-city-lite-${YM}.mmdb.gz"
          python3 -c "
          import gzip, shutil
          src = 'app/data/dbip-city-lite-${YM}.mmdb.gz'
          with gzip.open(src, 'rb') as f_in, open(src[:-3], 'wb') as f_out:
              shutil.copyfileobj(f_in, f_out)
          "
          rm "app/data/dbip-city-lite-${YM}.mmdb.gz"

      - name: Download yt-dlp (Linux static)
        run: |
          sudo curl -fsSL \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux" \
            -o /usr/local/bin/yt-dlp
          sudo chmod +x /usr/local/bin/yt-dlp

      - name: Download ffmpeg + ffprobe (BtbN Linux)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ASSET_URL=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest" \
            | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for a in data['assets']:
              if a['name'] == 'ffmpeg-master-latest-linux64-gpl.tar.xz':
                  print(a['browser_download_url']); break
          ")
          curl -fsSL "$ASSET_URL" -o ffmpeg-linux.tar.xz
          mkdir ffmpeg-extract
          tar -xf ffmpeg-linux.tar.xz -C ffmpeg-extract --strip-components=1
          sudo cp ffmpeg-extract/bin/ffmpeg  /usr/local/bin/ffmpeg
          sudo cp ffmpeg-extract/bin/ffprobe /usr/local/bin/ffprobe
          sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
          rm -rf ffmpeg-extract ffmpeg-linux.tar.xz

      - name: Configure (linux-release)
        run: cmake --preset linux-release

      - name: Build (linux-release)
        run: cmake --build --preset linux-release

      - name: Package .deb and .rpm
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bash release.sh --version "$VERSION" --skip-build --parallel

      - name: Compute SHA256 of packages
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DEB="dist/linux/stellar_${VERSION}_amd64.deb"
          RPM="dist/linux/stellar-${VERSION}-1.x86_64.rpm"
          DEB_SHA=$(sha256sum "$DEB" | awk '{print $1}')
          RPM_SHA=$(sha256sum "$RPM" | awk '{print $1}')
          printf 'deb:sha256:%s\nrpm:sha256:%s\n' "$DEB_SHA" "$RPM_SHA" > linux-sha256.txt
          echo "deb SHA256: sha256:${DEB_SHA}"
          echo "rpm SHA256: sha256:${RPM_SHA}"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v5
        with:
          name: linux-artifacts
          path: |
            dist/linux/stellar_*.deb
            dist/linux/stellar-*.rpm
            linux-sha256.txt
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  release:
    runs-on: ubuntu-22.04
    needs: [build-windows, build-linux]
    # A skipped build (single-platform run) leaves its need in the "skipped" state,
    # which would otherwise skip this job too. Run as long as nothing actually failed
    # and at least one build produced something.
    if: >-
      ${{
        always()
        && !cancelled()
        && needs.build-windows.result != 'failure'
        && needs.build-linux.result != 'failure'
        && (needs.build-windows.result == 'success' || needs.build-linux.result == 'success')
      }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version_override }}" ]]; then
            echo "version=${{ github.event.inputs.version_override }}" >> "$GITHUB_OUTPUT"
          else
            ver=$(grep -oP 'project\s*\(\s*\w+\s+VERSION\s+\K[\d.]+' CMakeLists.txt | head -1)
            echo "version=$ver" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python3 - "$VERSION" changelog.md > release-body.md <<'PYEOF'
          import sys, re
          version = sys.argv[1]
          text    = open(sys.argv[2], encoding='utf-8').read()
          m = re.search(
              rf'## Version {re.escape(version)}.*?(?=\n## Version |\Z)',
              text, re.DOTALL)
          print(m.group(0).strip() if m else f"Release {version}")
          PYEOF
          echo "--- release body ---"
          cat release-body.md

      - name: Download Windows artifacts
        if: ${{ needs.build-windows.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: windows-artifacts
          path: release-artifacts/windows

      - name: Download Linux artifacts
        if: ${{ needs.build-linux.result == 'success' }}
        uses: actions/download-artifact@v5
        with:
          name: linux-artifacts
          path: release-artifacts/linux

      - name: Read SHA256 values
        id: hashes
        run: |
          # A platform skipped for this run leaves its sha empty; downstream steps
          # only touch update.json fields / release assets for platforms that built.
          WIN_SHA=""; DEB_SHA=""; RPM_SHA=""
          if [ -f release-artifacts/windows/windows-sha256.txt ]; then
            WIN_SHA=$(cat release-artifacts/windows/windows-sha256.txt)
          fi
          if [ -f release-artifacts/linux/linux-sha256.txt ]; then
            DEB_SHA=$(grep '^deb:' release-artifacts/linux/linux-sha256.txt | cut -d: -f2-)
            RPM_SHA=$(grep '^rpm:' release-artifacts/linux/linux-sha256.txt | cut -d: -f2-)
          fi
          echo "win_sha=$WIN_SHA" >> "$GITHUB_OUTPUT"
          echo "deb_sha=$DEB_SHA" >> "$GITHUB_OUTPUT"
          echo "rpm_sha=$RPM_SHA" >> "$GITHUB_OUTPUT"
          echo "Windows : ${WIN_SHA:-(skipped)}"
          echo "deb     : ${DEB_SHA:-(skipped)}"
          echo "rpm     : ${RPM_SHA:-(skipped)}"

      - name: Show update.json preview (dry run)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          YM=$(date -u +%Y-%m)
          WIN_SHA="${{ steps.hashes.outputs.win_sha }}"
          DEB_SHA="${{ steps.hashes.outputs.deb_sha }}"
          RPM_SHA="${{ steps.hashes.outputs.rpm_sha }}"
          BASE="https://github.com/Ninka-Rex/Stellar/releases/download"
          python3 - "$VERSION" "$WIN_SHA" "$DEB_SHA" "$RPM_SHA" "$YM" <<'PYEOF'
          import json, sys
          version, win_sha, deb_sha, rpm_sha, ym = sys.argv[1:]
          BASE = "https://github.com/Ninka-Rex/Stellar/releases/download"
          with open('update.json', encoding='utf-8') as f:
              data = json.load(f)
          data['version']    = version
          data['IPtoCityDB'] = f"https://download.db-ip.com/free/dbip-city-lite-{ym}.mmdb.gz"
          # Only touch fields for platforms that actually built this run, so a
          # single-platform release doesn't wipe the other platform's URL/sha.
          if win_sha:
              data['windowsInstallerUrl'] = f"{BASE}/{version}/StellarSetup-{version}.exe"
              data['windowsSha256']       = win_sha
          if deb_sha:
              data['linuxDebUrl']    = f"{BASE}/{version}/stellar_{version}_amd64.deb"
              data['linuxDebSha256'] = deb_sha
          if rpm_sha:
              data['linuxRpmUrl']    = f"{BASE}/{version}/stellar-{version}-1.x86_64.rpm"
              data['linuxRpmSha256'] = rpm_sha
          print("--- update.json preview ---")
          print(json.dumps(data, indent=2))
          PYEOF

      # ── Steps below are skipped on dry run ───────────────────────────────────

      - name: Create GitHub Release and upload assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Only attach assets for platforms built this run.
          ASSETS=()
          for f in release-artifacts/windows/StellarSetup-*.exe \
                   release-artifacts/linux/stellar_*.deb \
                   release-artifacts/linux/stellar-*.rpm; do
            [ -f "$f" ] && ASSETS+=("$f")
          done
          [ "${#ASSETS[@]}" -gt 0 ] || { echo "ERROR: no release assets found"; exit 1; }
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "Stellar Download Manager $VERSION" \
            --notes-file release-body.md \
            --target master \
            "${ASSETS[@]}"

      - name: Update update.json
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          YM=$(date -u +%Y-%m)
          python3 - "$VERSION" \
            "${{ steps.hashes.outputs.win_sha }}" \
            "${{ steps.hashes.outputs.deb_sha }}" \
            "${{ steps.hashes.outputs.rpm_sha }}" \
            "$YM" <<'PYEOF'
          import json, sys
          version, win_sha, deb_sha, rpm_sha, ym = sys.argv[1:]
          BASE = "https://github.com/Ninka-Rex/Stellar/releases/download"
          with open('update.json', encoding='utf-8') as f:
              data = json.load(f)
          data['version']    = version
          data['IPtoCityDB'] = f"https://download.db-ip.com/free/dbip-city-lite-{ym}.mmdb.gz"
          # Only touch fields for platforms that actually built this run, so a
          # single-platform release doesn't wipe the other platform's URL/sha.
          if win_sha:
              data['windowsInstallerUrl'] = f"{BASE}/{version}/StellarSetup-{version}.exe"
              data['windowsSha256']       = win_sha
          if deb_sha:
              data['linuxDebUrl']    = f"{BASE}/{version}/stellar_{version}_amd64.deb"
              data['linuxDebSha256'] = deb_sha
          if rpm_sha:
              data['linuxRpmUrl']    = f"{BASE}/{version}/stellar-{version}-1.x86_64.rpm"
              data['linuxRpmSha256'] = rpm_sha
          with open('update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')
          PYEOF

      - name: Commit and push update.json
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add update.json
          git diff --cached --quiet || \
            git commit -m "chore: bump update.json to $VERSION"
          git push origin HEAD:master

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo ""
          echo "DRY RUN complete. Artifacts built and packaged successfully."
          echo "Skipped: gh release create, update.json commit, git push."
          echo "To release for real, re-run with 'Dry run' unchecked."
